# Health-check the same public product list query used by index.html / js/home.js:
#   products?select=id,name,...&listing_status=eq.active&order=created_at.desc
# Query at most one row so the check stays light.
name: Supabase health check

on:
  schedule:
    # Four times daily (UTC): 08:00 / 12:00 / 18:00 / 22:00 Asia/Taipei
    - cron: "0 0,4,10,14 * * *"
  workflow_dispatch:

jobs:
  public-products:
    name: Public products API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call public product list (limit 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          SELECT='id,name,category,description,price,quantity,image_url,created_at,seller:profiles!products_seller_id_fkey(display_name)'
          URL="${BASE}/rest/v1/products?select=${SELECT}&listing_status=eq.active&order=created_at.desc&limit=1"

          echo "GET ${BASE}/rest/v1/products (active, limit=1)"
          HTTP_CODE=$(curl -sS -o /tmp/supabase-health.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "$URL")

          echo "HTTP status: ${HTTP_CODE}"
          if [ ! "$HTTP_CODE" -ge 200 ] || [ ! "$HTTP_CODE" -lt 300 ]; then
            echo "::error::Supabase public products health check failed with HTTP ${HTTP_CODE}"
            head -c 2000 /tmp/supabase-health.json || true
            echo
            exit 1
          fi

          echo "Response OK"
          head -c 500 /tmp/supabase-health.json || true
          echo
